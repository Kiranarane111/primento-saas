<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primento SaaS</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f7fb;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 400px;
            margin: auto;
            margin-top: 50px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ddd;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        #msg {
            margin-top: 10px;
            color: green;
        }
    </style>
</head>

<body>

<header>
    <h2>Primento SaaS 🚀</h2>
</header>

<div class="container">

    <h3>Login System</h3>

    <input id="email" type="text" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="msg"></p>

</div>

<script>
function login() {
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if(email && password){
        document.getElementById("msg").innerText =
        "Login Success 🚀 Welcome to Primento SaaS";
    } else {
        document.getElementById("msg").innerText =
        "Please enter email & password";
    }
}
</script>

</body>
</html>
